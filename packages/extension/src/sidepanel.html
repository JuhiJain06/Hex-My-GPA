<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f1; --fg: #1f2328; --muted: #6a6f76; --bad: #b3412e; --line: #d8d5cc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181b; --fg: #e8e6e1; --muted: #9aa0a6; --bad: #ef8a76; --line: #33363b; } }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 1.2rem; margin: 0 0 .75rem; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .big { font: 600 2.6rem/1.1 ui-monospace, monospace; margin: .25rem 0 .75rem; }
  .topic { font-size: 1.05rem; font-weight: 600; word-break: break-word; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; }
  label { display: block; margin: .6rem 0 .2rem; }
  input, select, button { font: inherit; box-sizing: border-box; width: 100%; padding: .4rem .55rem; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; }
  button { margin-top: .9rem; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Study Buddy</h1>
<p id="offline" class="muted" hidden>Desktop buddy not running</p>
<section id="live" hidden>
  <div id="topic" class="topic"></div>
  <div id="timeLeft" class="big">--:--</div>
  <dl>
    <dt>Today</dt><dd id="today">0h 0m</dd>
    <dt>Streak</dt><dd id="streak">0 days</dd>
  </dl>
</section>
<form id="start" hidden>
  <label for="topicIn">Topic</label>
  <input id="topicIn" maxlength="200" required autocomplete="off">
  <label for="mode">Mode</label>
  <select id="mode"><option value="laptop">Laptop</option><option value="book">Book</option></select>
  <label for="goal">Goal (optional)</label>
  <input id="goal" autocomplete="off">
  <label for="hours">Planned hours (optional)</label>
  <input id="hours" type="number" min="0.25" step="0.25">
  <button type="submit">Start session</button>
  <p id="startMsg" class="bad" role="status"></p>
</form>
<script src="sidepanel.js"></script>
</body>
</html>
