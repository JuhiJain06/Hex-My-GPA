<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="sprite.css">
<style>
  body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); margin: 0; padding: 16px; }
  header { display: flex; align-items: center; gap: 10px; margin: 0 0 .75rem; }
  h1 { font-size: 1.2rem; font-weight: 800; margin: 0; }
  #buddy { display: flex; justify-content: center; align-items: flex-end; min-width: 72px; height: 64px; flex: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
  .muted { color: var(--muted); }
  .bad { color: var(--danger); }
  .big { font: 800 2.6rem/1.1 var(--font); font-variant-numeric: tabular-nums; margin: .25rem 0 .75rem; color: var(--accent-text); }
  .topic { font-size: 1.05rem; font-weight: 700; word-break: break-word; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; }
  label { display: block; margin: .6rem 0 .2rem; color: var(--muted); font-size: .9rem; }
  input, select, button { font: inherit; box-sizing: border-box; width: 100%; padding: .45rem .6rem; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button { margin-top: .9rem; cursor: pointer; font-weight: 700; background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><div id="buddy" hidden></div><h1>Study Buddy</h1></header>
<p id="offline" class="muted" hidden>Desktop buddy not running</p>
<section id="live" class="card" hidden>
  <div id="topic" class="topic"></div>
  <div id="timeLeft" class="big">--:--</div>
  <dl>
    <dt>Today</dt><dd id="today">0h 0m</dd>
    <dt>Streak</dt><dd id="streak">0 days</dd>
  </dl>
</section>
<form id="start" class="card" hidden>
  <label for="topicIn">Topic</label>
  <input id="topicIn" maxlength="200" required autocomplete="off">
  <label for="mode">Mode</label>
  <select id="mode"><option value="laptop">Laptop</option><option value="book">Book</option></select>
  <label for="goal">Goal (optional)</label>
  <input id="goal" autocomplete="off">
  <label for="hours">Planned hours (optional)</label>
  <input id="hours" type="number" min="0.25" step="0.25">
  <button type="submit">Start session</button>
  <p id="startMsg" class="bad" role="status"></p>
</form>
<script src="sidepanel.js"></script>
</body>
</html>
