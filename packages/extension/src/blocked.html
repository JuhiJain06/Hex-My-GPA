<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked · Study Buddy</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f1; --fg: #1f2328; --muted: #6a6f76; --accent: #2f6f5e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181b; --fg: #e8e6e1; --muted: #9aa0a6; --accent: #7cc4ad; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif;
         display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
  p { margin: .25rem 0; color: var(--muted); }
  #topic { color: var(--fg); }
  button { margin-top: 1.5rem; font: inherit; padding: .5rem 1.25rem; border-radius: 8px;
           border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="msg">Blocked during this focus block</h1>
  <p id="site"></p>
  <p id="topic" hidden></p>
  <button id="back" type="button">Back</button>
</main>
<script src="blocked.js"></script>
</body>
</html>
