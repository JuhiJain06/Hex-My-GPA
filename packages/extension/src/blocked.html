<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked · Study Buddy</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="sprite.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--font);
         display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
  main { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
         padding: 28px 32px; max-width: 640px; }
  .row { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
  #buddy { display: flex; justify-content: center; align-items: flex-end; min-width: 160px; height: 140px; flex: none; }
  h1 { font-size: 1.6rem; font-weight: 800; margin: 0; text-align: left; max-width: 360px; }
  p { margin: .25rem 0; color: var(--muted); }
  #topic { color: var(--text); font-weight: 600; }
  button { margin-top: 1.25rem; font: inherit; font-weight: 700; padding: .5rem 1.5rem; border-radius: var(--radius-sm);
           border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); cursor: pointer; box-shadow: var(--shadow-sm); }
  #continue { color: var(--accent-text); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  @media (max-width: 480px) { h1 { text-align: center; } }
</style>
</head>
<body>
<main>
  <div class="row">
    <div id="buddy"></div>
    <h1 id="msg">Blocked during this focus block</h1>
  </div>
  <p id="site"></p>
  <p id="topic" hidden></p>
  <button id="back" type="button">Back</button>
  <p><a id="continue" hidden></a></p>
</main>
<script src="blocked.js"></script>
</body>
</html>
