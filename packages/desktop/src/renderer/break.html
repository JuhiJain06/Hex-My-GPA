<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Break</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="sprite.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 18px 24px; gap: 8px; }
    #buddy { display: flex; justify-content: center; width: 190px; height: 160px; }
    #suggestion { font-size: 22px; font-weight: 700; margin: 6px 0; }
    #countdown { font-size: 40px; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent-text); }
    #back h2 { font-size: 20px; margin: 0 0 14px; }
    .btns { display: flex; gap: 8px; justify-content: center; }
    .btns button { padding: 8px 18px; }
  </style>
</head>
<body>
  <div id="buddy"></div>
  <section id="during">
    <div class="kicker">Break</div>
    <div id="suggestion"></div>
    <div id="countdown">--:--</div>
  </section>
  <section id="back" class="hidden">
    <h2 id="backMsg"></h2>
    <div class="btns">
      <button id="endSession">End session</button>
      <button id="start" class="primary">Start</button>
    </div>
  </section>
  <script src="break.js"></script>
</body>
</html>
