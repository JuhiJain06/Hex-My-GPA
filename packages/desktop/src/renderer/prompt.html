<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Study Buddy</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); }
    html, body { background: var(--card); }
    #q { font-size: 15px; font-weight: 700; }
    .btns { display: flex; gap: 6px; }
    .btns button { flex: 1 1 auto; min-width: 0; padding: 5px 8px; font-size: 13px; line-height: 1.25; }
    /* The shortcut sits under its label so all buttons fit on one row. */
    kbd { display: block; font: 10.5px/1.2 var(--mono); color: var(--muted); margin-top: 1px; }
    .primary kbd { color: var(--on-accent); }
  </style>
</head>
<body>
  <div class="kicker" id="app"></div>
  <div id="q"></div>
  <div id="gray" class="btns hidden">
    <button id="yes" class="primary">Yes<kbd>Ctrl+Alt+Y</kbd></button>
    <button id="no">No<kbd>Ctrl+Alt+N</kbd></button>
  </div>
  <div id="offer" class="btns hidden">
    <button id="block" class="primary">Block</button>
    <button id="fine">It's for study</button>
    <button id="later">Not now</button>
  </div>
  <script src="prompt.js"></script>
</body>
</html>
